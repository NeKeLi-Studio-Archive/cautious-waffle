name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Unzip
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
          [ -n "$ZIP" ] || { echo "Brak pliku .zip w repozytorium"; exit 1; }
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/project"
          POM=$(find "$RUNNER_TEMP/project" -name pom.xml | head -n 1)
          [ -n "$POM" ] || { echo "Brak pom.xml w ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: MapthioMenus
          path: ${{ env.PROJECT_DIR }}/target/MapthioMenus-1.0.0.jar
